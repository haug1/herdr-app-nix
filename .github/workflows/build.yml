name: Build and cache Herdr

on:
  push:
    branches: [main]
    paths:
      - '**/*.nix'
      - flake.lock
      - .github/workflows/build.yml
  pull_request:
    paths:
      - '**/*.nix'
      - flake.lock
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: haug1
          skipPush: true

      - name: Build Herdr for x86-64 Linux
        run: nix build --no-write-lock-file --print-build-logs .#herdr-app

      - name: Smoke-test Herdr with Core
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Push Herdr and its runtime dependencies to Cachix
        if: github.ref == 'refs/heads/main' && env.CACHIX_AUTH_TOKEN != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push haug1 ./result
